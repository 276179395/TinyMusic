name: ios

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'desktop/crates/**'
      - 'desktop/packages/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'desktop/crates/**'
      - 'desktop/packages/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim,aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop -> target
            ios -> target

      - name: 安装前端依赖
        run: |
          cd desktop
          pnpm install --no-frozen-lockfile

      - name: 公共库测试（桌面仍在用）
        run: |
          cd desktop
          pnpm -F @tinymusic/shared test
          pnpm -F @tinymusic/theme check

      - name: Rust 测试（桌面 workspace）
        run: |
          cd desktop
          cargo test --workspace

      - name: 构建 iOS 静态库（S3-only）
        run: |
          cd ios
          cargo build -p tinymusic-ffi --target aarch64-apple-ios-sim

      - name: 检查 provider 没有进 iOS 依赖
        run: |
          cd ios
          if cargo tree -p tinymusic-ffi -e features | grep -q 'providers'; then
            echo "providers feature 被带进 tinymusic-ffi，iOS 合规构建失败"
            exit 1
          fi
          if strings target/aarch64-apple-ios-sim/debug/libtinymusic_ffi.a | grep -Eiq 'kuwo|netease|music\.163\.com'; then
            echo "静态库里出现平台 provider 字符串"
            exit 1
          fi

      - name: 安装 XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null; then
            brew install xcodegen
          fi

      - name: 编译模拟器 App
        run: |
          cd ios
          xcodegen generate
          xcodebuild -project TinyMusic.xcodeproj -scheme TinyMusic \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -configuration Debug -derivedDataPath "$RUNNER_TEMP/TinyMusicDerived" \
            CODE_SIGNING_ALLOWED=NO build | tail -40

      - name: Swift 单测（iOS 18.5 兼容回归）
        run: |
          cd ios
          xcodegen generate
          xcodebuild test -project TinyMusic.xcodeproj -scheme TinyMusic \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -derivedDataPath "$RUNNER_TEMP/TinyMusicTestDerived" \
            -only-testing:TinyMusicTests | tail -30

      - name: Release archive（无签名，验 App Store 包结构）
        run: |
          cd ios
          xcodebuild archive -project TinyMusic.xcodeproj -scheme TinyMusic \
            -destination 'generic/platform=iOS' -configuration Release \
            -archivePath "$RUNNER_TEMP/TinyMusic.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/TinyMusicArchiveDerived" \
            CODE_SIGNING_ALLOWED=NO | tail -20
