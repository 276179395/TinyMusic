name: TinyMusic
options:
  bundleIdPrefix: com.tinymusic
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  TinyMusic:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_NAME: TinyMusic
        PRODUCT_BUNDLE_IDENTIFIER: com.tinymusic.app
        INFOPLIST_FILE: Supporting/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridging-Header.h
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        CLANG_ENABLE_MODULES: "YES"
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC"]
        # 本地调试不需要签名；真机/TestFlight 时再覆盖
        CODE_SIGNING_ALLOWED: "NO"
    preBuildScripts:
      # bundle 是构建产物（gitignore），所以不能在生成工程时写死文件引用，
      # 统一在编译期拷进 App 的 Resources 目录
      - name: "打包 Lynx bundle"
        script: |
          SRC="${SRCROOT}/../../app/dist/main.lynx.bundle"
          DST="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/main.lynx.bundle"
          if [ -f "$SRC" ]; then
            cp "$SRC" "$DST"
            echo "[TinyMusic] 已打入 Lynx bundle: $DST"
          else
            echo "warning: 缺少 main.lynx.bundle，先跑 pnpm build:mobile"
          fi
        basedOnDependencyAnalysis: false
