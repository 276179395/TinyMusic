<style>
:root { color-scheme: light dark; --fg:#17171a; --muted:#666; --bg:#fafafa; --card:#fff; --line:#e5e5e5; --accent:#ff3b30; }
@media (prefers-color-scheme: dark) { :root { --fg:#f2f2f2; --muted:#a0a0a0; --bg:#111; --card:#1b1b1d; --line:#2c2c2e; --accent:#ff453a; } }
body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.7 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif; }
main { max-width:640px; margin:0 auto; padding:72px 24px; }
h1 { font-size:34px; letter-spacing:-0.03em; margin:0 0 8px; }
p { color:var(--muted); }
.card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:24px; margin:24px 0; }
a { color:var(--accent); }
nav { display:flex; gap:16px; flex-wrap:wrap; font-size:14px; }
nav a { color:var(--muted); text-decoration:none; }

<h1>TinyMusic iOS</h1>
<p>只播放你自己 S3 兼容存储的本地播放器。没有曲库、搜索、平台下载或登录。</p>
<div class="card">
<p>S3 网盘浏览 · AVPlayer 流式播放 · 指定歌曲/歌单离线缓存 · 收藏 · 10 段 EQ · iCloud 配置同步 · Liquid Glass。</p>
