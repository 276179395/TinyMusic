[package]
name = "tinymusic-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Music library, remote storage, and playback core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "stream",
] }
tokio = { version = "1", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "fs",
  "io-util",
  "sync",
  "time",
  "net",
] }
rusqlite = { version = "0.32", features = ["bundled"] }
url = "2"
getrandom = "0.4"
percent-encoding = "2"
tempfile = "3"
quick-xml = { version = "0.42", features = ["serialize"] }
# S3 SigV4 签名（只用 SHA-256 / HMAC-SHA256，不引 aws-sdk）
sha2 = "0.10"
hmac = "0.12"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time"] }
