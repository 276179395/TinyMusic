[package]
name = "tinymusic-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "iOS 原生壳的 C ABI：S3-only 业务命令（不起本地 HTTP 服务）"

[lib]
name = "tinymusic_ffi"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tinymusic-core = { path = "../../../desktop/crates/core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
